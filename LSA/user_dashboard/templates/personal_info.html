{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Info</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1">
</head>
<body>
    {% include 'header.html' %}

    <div class="pi-container">
        <!-- Sidebar Menu -->
        {% include 'myorder-sidebar.html' %}

        <!-- Contact Form Section -->
       
    <div class="pi-content">
        <h2>Personal Info</h2>
        <form id="pi-profile-form" enctype="multipart/form-data">
            <div class="pi-form-section">
                <label>Username <span class="pi-required">*</span></label>
                <input type="text" id="pi-username"  class="fixed-username"
                value="{{ user.username }}" 
                placeholder="Enter your name" 
                required>
                <small class="pi-error-message" id="pi-username-error"></small>
            </div>

            <!-- Profile Picture Upload -->
            <div class="pi-profile-photo-section">
                <label>Upload Profile Photo</label>
                <div class="pi-upload-box">
                    <input type="file" id="pi-profile-photo" name="profile_photo" hidden onchange="piPreviewImage(event)">

                    <label for="pi-profile-photo" class="pi-upload-label">+</label>
                    <img id="pi-profile-preview" 
                    src="{{ user_privacy.profile_photo.url|default:'/media/default-profile.jpg' }}" 
                    width="100" 
                    alt="Profile Photo">
                </div>
                <small class="pi-error-message" id="pi-profile-photo-error"></small>
            </div>
            <div class="pi-form-row">
                <div class="pi-form-section half-width">
                    <label>Phone Number <span class="pi-required">*</span></label>
                    <input type="text" id="pi-phone-number" 
                           value="{{ user_privacy.phone_number|default_if_none:'' }}" 
                           placeholder="Enter a valid phone number" required>
                    <small class="pi-error-message" id="pi-phone-error"></small>
                </div>
            
                <div class="pi-form-section half-width">
                    <label>Email</label>
                    <input type="email" value="{{ user.email }}" disabled>
                </div>
            </div>

            <div class="pi-form-section">
                <label>Your Address <span class="pi-required">*</span></label>
                <textarea id="pi-address" placeholder="Enter your address" required>{{ user_privacy.address|default_if_none:'' }}</textarea>

                   <small class="pi-error-message" id="pi-address-error"></small>
            </div>

            <!-- Social Media -->
            <h3>Social</h3>
            <div class="pi-form-row">
                <div class="pi-form-section half-width">
                    <label>Website</label>
                    <input type="url" id="pi-website" 
                           value="{{ user_privacy.website|default_if_none:'' }}" 
                           placeholder="Enter your website URL">
                    <small class="pi-error-message" id="pi-website-error"></small>
                </div>
            
                <div class="pi-form-section half-width">
                    <label>Twitter</label>
                    <input type="text" id="pi-twitter" 
                           value="{{ user_privacy.twitter|default_if_none:'' }}" 
                           placeholder="Enter your Twitter handle">
                </div>
            </div>
            <div class="pi-form-row">
            <button type="button" class="pi-update-btn" onclick="piUpdateProfile()">Update Profile</button>
            <button type="reset" class="pi-clear-btn">Clear all</button>
            </div>
        </form>
    </div>
</div>
    <script>
        function GetCSRFToken() {
            let csrfToken = document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
            return csrfToken;
        }

        function piValidateForm() {
            let isValid = true;
            
            document.querySelectorAll('.pi-error-message').forEach(el => el.textContent = '');

            let username = document.getElementById("pi-username").value.trim();
            if (username === "") {
                document.getElementById("pi-username-error").textContent = "Username is required.";
                isValid = false;
            }

            let phone = document.getElementById("pi-phone-number").value.trim();
            let phoneRegex = /^\+44\d{10}$/; 
            if (!phoneRegex.test(phone)) {
                document.getElementById("pi-phone-error").textContent = "Enter a valid UK phone number starting with +44 and followed by 10 digits.";
                isValid = false;
            }

            let address = document.getElementById("pi-address").value.trim();
            if (address === "") {
                document.getElementById("pi-address-error").textContent = "Address is required.";
                isValid = false;
            }

            let website = document.getElementById("pi-website").value.trim();
            if (website && !website.match(/^(https?:\/\/)/)) {
                document.getElementById("pi-website-error").textContent = "Website must start with http:// or https://.";
                isValid = false;
            }

            let profilePhoto = document.getElementById("pi-profile-photo").files[0];
            if (profilePhoto) {
                let validExtensions = ["image/jpeg", "image/png", "image/jpg"];
                if (!validExtensions.includes(profilePhoto.type)) {
                    document.getElementById("pi-profile-photo-error").textContent = "Only JPG, PNG, and JPEG files are allowed.";
                    isValid = false;
                }
            }

            return isValid;
        }
    
        function piPreviewImage(event) {
            let file = event.target.files[0];
            if (file) {
                let validExtensions = ["image/jpeg", "image/png", "image/jpg"];
                if (!validExtensions.includes(file.type)) {
                    document.getElementById("pi-profile-photo-error").textContent = "Only JPG, PNG, and JPEG files are allowed.";
                    return;
                }
                let reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById("pi-profile-preview").src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }
        function piUpdateProfile() {
    if (!piValidateForm()) {
        return;
    }

    let formData = new FormData();
    formData.append("username", document.getElementById("pi-username").value);
    formData.append("phone_number", document.getElementById("pi-phone-number").value);

    let profilePhotoInput = document.getElementById("pi-profile-photo");
    if (profilePhotoInput.files.length > 0) {
        formData.append("profile_photo", profilePhotoInput.files[0]); 
    }

    formData.append("address", document.getElementById("pi-address").value);
    formData.append("website", document.getElementById("pi-website").value);
    formData.append("twitter", document.getElementById("pi-twitter").value);

    fetch("/api/personal-info/", {  
        method: "PUT",
        headers: {
            "X-CSRFToken": GetCSRFToken(), 
        },
        body: formData
    })
    .then(response => response.json().then(data => ({ status: response.status, body: data })))
    .then(({ status, body }) => {
        console.log("Status Code:", status);
        console.log("Response:", body);

        if (status === 200) {
            alert("Profile updated successfully!");

            // Get the image element
            let profileImg = document.querySelector(".pi-upload-box img"); 
            
            // Ensure the backend returns an updated image URL
            if (profileImg && body.image_url) {  
                let newSrc = body.image_url + "?t=" + new Date().getTime();
                
                // Preload the new image to prevent flickering
                let tempImg = new Image();
                tempImg.onload = function() {
                    profileImg.src = newSrc;
                };
                tempImg.src = newSrc;
            }
        } else {
            alert("Error: " + JSON.stringify(body));  
        }
    })
    .catch(error => {
        console.error("Fetch Error:", error);
    });
}

    </script>

    <style>
/* Reset default styles */
/* * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Rajdhani;
} */

/* Layout */
.pi-container {
    display: flex;
    min-height: 100vh;
    background-color: white;
}


/* Main Content */
.pi-content {
    flex-grow: 1;
    max-width: 800px;
    background-color: #fff;
    padding: 30px;
    margin-left: 90px;
    margin-top: 40px;
}

/* Heading */
.pi-content h2 {
    font-size: 36px;
    font-weight: 600;
    color: #333;
    margin-bottom: 20px;
}

/* Form */
#pi-profile-form {
    display: flex;
    flex-direction: column;
}

/* Form Sections */
.pi-form-section {
    margin-bottom: 20px;
}

.pi-form-section label {
    font-size: 14px;
    font-weight: 500;
    color: #666;
    margin-bottom: 5px;
    display: block;
    text-transform: uppercase;
}

/* Input Fields */
.pi-form-section input,
.pi-form-section textarea {
    width: 95%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 14px;
    background-color: #f9f9f9;
    outline: none;
    transition: border 0.3s;
}

.pi-form-section input:focus,
.pi-form-section textarea:focus {
    border-color: #ff6600;
    background-color: #fff;
}

/* Profile Picture Upload Section */
.pi-profile-photo-section {
    text-align: center;
    margin-bottom: 20px;
}

.pi-upload-box {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 120px;
    height: 120px;
    margin: auto;
    border: 2px dashed #ddd;
    border-radius: 50%;
    cursor: pointer;
    background-color: #f9f9f9;
}

.pi-upload-label {
    font-size: 40px;
    font-weight: bold;
    color: #ff6600;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
}

.pi-upload-box img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

/* Buttons */
.pi-update-btn, .pi-clear-btn {
    width: 50%;
    border-top-left-radius: 10px;
    border-bottom-right-radius: 10px;
    padding: 12px;
    border: none;
    /* border-radius: 5px; */
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.pi-update-btn {
    background-color: #ff6600;
    color: #fff;
    margin-bottom: 10px;
}

.pi-clear-btn {
    background-color: #eee;
    color: #333;
}

.pi-update-btn:hover {
    background-color: #e65c00;
}

.pi-clear-btn:hover {
    background-color: #ddd;
}

/* Social Media Section */
.pi-content h3 {
    font-size: 30px;
    font-weight: 600;
    color: #333;
    margin-bottom: 15px;
}

/* Error Messages */
.pi-error-message {
    color: red;
    font-size: 12px;
    margin-top: 5px;
}

.pi-form-row {
    display: flex;
    gap: 20px; /* Adds space between elements */
    justify-content: space-between;
}

.half-width {
    width: 50%;
}

/* Adjust buttons in one line */
.pi-form-row:last-child {
    margin-top: 20px;
}

.pi-update-btn, .pi-clear-btn {
    flex: 1; /* Makes both buttons equal in width */
    margin: 0;
}



/* Responsive Design */
@media screen and (max-width: 768px) {
    .pi-container {
        flex-direction: column;
    }

 
    .pi-content {
        margin-left: 0;
        margin-top: 0px;
    }
}
@media screen and (max-width: 1024px) {
    .pi-container {
        flex-direction: column;
        align-items: center;
        padding: 30px;
        min-height: auto; /* Prevents unnecessary extra height */
    }

    .pi-content {
        max-width: 90%;
        margin: 0 auto;
        padding: 25px;
    }

    .pi-form-row {
        gap: 15px;
    }

    .half-width {
        width: 48%;
    }

    .pi-update-btn, .pi-clear-btn {
        width: 100%;
    }

    .pi-upload-box {
        width: 110px;
        height: 110px;
    }

    /* Reduce space between container and footer */
    .pi-container {
        padding-bottom: 10px; /* Reduce bottom padding */
    }

    .pi-content {
        margin-bottom: 10px; /* Reduce bottom margin */
    }

   
}

    </style>
  
</body>
{% include 'footer.html' %}
</html>
