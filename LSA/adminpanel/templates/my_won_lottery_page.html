  {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Won Lottery</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    const mywon_lottery = '{{ csrf_token }}';
</script>
     <style>
        html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
}

body > .mywon-main-container {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 2rem;
    
}

.my-won-lottery-card-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5rem;
}

.my-won-lottery-card {
    width: 180px;
    height: auto;
    color: white;
    border-radius: 12px;
    padding: 1rem;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.5rem;
}

.my-won-lottery-card-blue {
    background: linear-gradient(135deg, #003f88, #00ff66, #ff6600);
}
.my-won-lottery-card-lightblue {
    background: linear-gradient(135deg, #1e90ff, #87cefa);
}
.my-won-lottery-card-purple {
    background: linear-gradient(135deg, #6a0dad, #9370db);
}

.my-won-lottery-prize-number {
    font-size: 1.5rem;
    font-weight: bold;
    color: #eee;
    margin-top: 30px;
    margin-bottom: 0.3rem;
}

.my-won-lottery-prize-status {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: rgba(255, 255, 255, 0.2);
    padding: 0.3rem 0.6rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: bold;
    color: #fff;
    text-align: right;
}

.my-won-lottery-prize-data {
    font-size: 0.9rem;
    text-align: left;
    color: #f0f0f0;
    line-height: 1.4;
}

.mywon-main-container {
    display: flex;
    align-items: flex-start;
    gap: 2rem;
    padding: 2rem;
}

.mywon-content {
    flex: 1;
}

.mywon-header {
    font-size: 36px;
    text-align: center;
    margin-bottom: 1rem;
    margin-top: 0px;
}

/* MOBILE RESPONSIVE STYLES */
@media screen and (max-width: 767px) {
    .mywon-main-container {
        flex-direction: column;
        padding: 1rem;
        gap: 1rem;
    }

    .mywon-header {
        font-size: 29px;
    }

    .my-won-lottery-card-grid {
        justify-content: center;
        gap: 1rem;
    }

    .my-won-lottery-card {
        width: 90%;
        margin: 0 auto;
    }

    /* Optional: Center sidebar or hide it */
    .mywon-sidebar {
        width: 100%;
        text-align: center;
    }
}

/* TABLET VIEW (769px to 1024px) */
@media screen and (min-width: 768px) and (max-width: 1024px) {
    .mywon-main-container {
        flex-direction: column;
        padding: 1.5rem;
        gap: 1.5rem;
      
    }

    .mywon-header {
        font-size: 40px;
    }

    .my-won-lottery-card-grid {
        justify-content: center;
        gap: 3.2rem;
    }

    .my-won-lottery-card {
        width: 40%; /* Show two cards per row */
        margin: 0 auto;
    }

    /* Optional: Resize sidebar if visible */
    .mywon-sidebar {
        width: 100%;
        text-align: center;
    }
}

</style>

</head>
<body >
    {% include 'header.html' %}

    

<div class="mywon-main-container">
    {% include 'myorder-sidebar.html' %}
    
    <div class="mywon-content">
        <h2 class="mywon-header">My Won Lotteries</h2>
        <div id="wonCardsContainer" class="my-won-lottery-card-grid"></div>
    </div>
</div>
        
    <script src="{% static 'js/custom.js' %}"></script>
    {% include 'footer.html' %}
</body>
</html>
