{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {{ category_name }} Lottery Events</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1">
    <script>
        const add_csrftoken = "{{ csrf_token }}"; 
        const category_id = "{{ category_id }}";
        const api_get_category_lottery_events_url = "{% url 'api_get_category_lottery_events' category_id=category_id %}";
        const api_get_categories_url = "{% url 'api_get_lottery_categories' %}";
        
        const bannerUrl = "{% url 'api_banner' %}";
        window.onload = function() {
            fetchCategoryLotteryEvents();
            category_fetchBanner();
            updateCartCount(); 
            updateFavoritesCount();
            header_navbar_fetchCategories();
            setupDropdown(".dropbtn_competitions", ".dropdown-content_competitions");
        };
    </script>
    <script src="{% static 'js/custom.js' %}"></script>
</head>
<body class="category_body">
    {% include 'header.html' %}
    <div class="category_banner-container" id="category_banner_container">
        
    </div>
    <h1 class="category_lottery_events_title"><img src="{{category_logo.url}}" alt="{{category_name}}Logo" class="category_icon"> {{ category_name }}</h1>
    <div class="category_lottery_events_container" id="category_lottery_events_container">

    </div>
       
       <div class="load-more-wrapper" id="load-more-wrapper">
        <button class="view-more-button" id="load-more-button">Load More</button>
    </div>
    {% include 'footer.html' %}
</body>
</html>
