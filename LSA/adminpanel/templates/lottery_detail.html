{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Event Detail</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const eventSlug = "{{ event.slug }}";
        const eventId = "{{ pk }}";
        const add_to_carturl = "{% url 'add_to_cart' %}";
        const cartUrl = "{% url 'cart' %}";
        const add_csrftoken = "{{ csrf_token }}";
        const api_get_categories_url = "{% url 'api_get_lottery_categories' %}";
        window.onload = function() {
            fetchLotteryEventDetails(eventSlug);
            fetchSimilarLotteryEvents(eventSlug);  
            header_navbar_fetchCategories(); 
            updateCartCount(); 
            updateFavoritesCount(); 
            setupDropdown(".dropbtn_competitions", ".dropdown-content_competitions");
            };
    </script>
    <script src="{% static 'js/custom.js' %}"></script>
</head>
<body class="lottery-detail-page">
    {% include 'header.html' %}

    <!-- Single Container -->
    <div class="lot-detail-container">
        <!-- Left Side: Image Section -->
        <div class="lot-detail-left">
            <div class="lot-detail-image">
                <img id="lot-detail-event-image" src="{{ event.image.url }}" alt="Event Image">
            </div>
            <div class="lot-detail-additional-images" id="additional-images-containerpopup"></div>

            <!-- Image Popup -->
            <div id="lot-detail-image-popup" class="hidden">
                <div class="lot-detail-popup-content">
                    <span id="lot-detail-close-popup" class="lot-detail-close-btn">×</span>
                    <button id="lot-detail-prev-image" class="lot-detail-popup-nav lot-detail-prev-btn">‹</button>
                    <img id="lot-detail-popup-image" src="" alt="Popup Image">
                    <button id="lot-detail-next-image" class="lot-detail-popup-nav lot-detail-next-btn">›</button>
                    <div class="lot-detail-image-counter">
                        <span id="lot-detail-current-image-index">0</span> / 
                        <span id="lot-detail-total-images">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Event Details -->
        <div class="lot-detail-right">
            <div class="lot-detail-info">
    <p id="lot-detail-event-draw-datetime"></p>
    
                <h1 id="lot-detail-event-title">Loading...</h1>
                <p id="lot-detail-event-description"></p>
                <p class="lot-detail-event-per-ticket-price" id="lot-detail-event-per-ticket-price"></p>
                <p class="lot-detail-price" id="lot-detail-event-price"></p>          
                <p id="event-sold-percentage" class="event-sold-percentage"></p>
                <p class="lot-detail-ticket-limit-info">
                    MAX TICKETS PER PERSON: <span id="lot-detail-ticket-max-limit"></span>
                </p>
                <!-- Sold Bar -->
                <!-- <div class="lot-detail-sold-bar-container">
                    <div class="lot-detail-sold-bar">
                        <div id="lot-detail-sold-bar-fill" class="lot-detail-sold-bar-fill-class" style="width: 0%"></div>
                    </div>
                    <p id="lot-detail-ticket-info">Sold: 0/0</p>
                </div>  -->
                <div style="width: 100%; height: 100%; border: 1px #BDBDBD solid;margin-top: 20px;"></div> 
                <p class="share-text">Share to</p>
                <div class="lot-social-icons">
                    <a href="https://www.facebook.com/sharer/sharer.php?u=YOUR_URL" target="_blank" class="icon facebook"></a>
                    <a href="https://twitter.com/intent/tweet?url=YOUR_URL&text=Check this out!" target="_blank" class="icon twitter"></a>
                    <a href="https://api.whatsapp.com/send?text=Check this out! YOUR_URL" target="_blank" class="icon whatsapp"></a>
                </div>
                <div style="width: 100%; height: 100%; border: 1px #BDBDBD solid;margin-top: 20px;"></div>
            <!-- Tabbed Interface -->
            <div class="lot-detail-tab-container">
                <div class="lot-detail-tab-content-container">
                    <!-- Online Entry Tab -->
                    <div class="lot-detail-tab-pane active" id="lot-detail-online-entry">
                        <div class="lot-detail-ticket-control-container">
                            <div class="lot-detail-ticket-selection">
                                <h3>How many tickets?</h3>
                                <div class="lot-detail-ticket-control-buttons">
                                    <button id="lot-detail-decrement-ticket" class="lot-detail-control-btn">-</button>
                                    <label for="lot-detail-ticket-count" class="ticket-count-label">Number of Tickets:</label>
                                    <input type="number" id="lot-detail-ticket-count" class="ticket-input" value="1" />
                                    <button id="lot-detail-increment-ticket" class="lot-detail-control-btn">+</button>
                                </div>
                                <!-- <div class="lot-detail-ticket-slider-container">
                                    <input 
                                        type="range" 
                                        id="lot-detail-ticket-slider" 
                                        class="lot-detail-ticket-slider" 
                                        value="" 
                                        step="1"
                                    />
                                </div> -->
                                </div>
                                <br>
                                <!-- Editable Amount Field -->
                                <div class="lot-detail-ticket-amount">
                                    <label for="lot-detail-total-amount"class="lot-detail-total-label">Total Amount: </label>
                                    <div class="currency-container">
                                        <span class="currency-symbol">£</span>
                                        <input type="number" id="lot-detail-total-amount" class="amount-input" value="0" min="0" />
                                    </div>
                                </div>
                                <p id="ticket-error-message" style="color: red; display: none;"></p>

                                                   <div class="tick-modal-buttons">
                                                    <button id="buy-now-button" class="buy-now-button" data-event-slug="{{ event.slug }}" data-max-limit="{{ max_limit }}">
                                                                    Buy Now
                                                                </button>
                                                                
                                                                

                                    <button id="add-to-cart-button" class="add-to-cart-button" data-event-slug="{{ event.slug }}" data-max-limit="{{ max_limit }}">
                                        <!-- <img src="/media/lottery_images/Cart.svg" alt="Cart" class="cart-icon"> -->
                                        Add to Cart
                                    </button>
                              </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
  <!-- Competition Details Container -->
<div class="lot-detail-competition-container">
    <h2>Competition Details</h2>
    <div id="lot-detail-competition-list" class="lot-detail-competition-content"></div>
</div>


    <!-- Cart Modal -->
    <div id="cart-modal" class="cart-modal hiddencart">
        <div class="cart-modal-content">
            <span class="cart-modal-close">&times;</span>
            <p id="cart-modal-message"></p>
            <div class="cart-modal-buttons">
                <button id="cart-keep-shopping" class="cart-button">Keep Shopping</button>
                <button id="cart-view-cart" class="cart-button">View Cart</button>
            </div>
        </div>
    </div>
    <div class="lot-detail-similar-events">
        <h3>Similar items</h3>
        <div class="similar-events-wrapper">
            <button id="scroll-left" class="scroll-btn">&lt;</button>
            <div id="similar-lottery-events-container" class="similar-lottery-events-scroll">
                <!-- Similar events will be populated here via JS -->
            </div>
            <button id="scroll-right" class="scroll-btn">&gt;</button>
        </div>
    </div>
    {% include 'footer.html' %}
</body>
</html>
