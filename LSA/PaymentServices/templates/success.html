
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=/my-orders/">
    <title>success </title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
          background-color: #ffffff; /* White Background */
          color: #000000; /* Black Font Color */
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          font-family: 'Poppins', sans-serif;
          text-align: center;
        }
  
        .success-container {
          background-color: #f8f9fa; /* Light Gray Background */
          padding: 2rem;
          border-radius: 1rem;
          box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
          max-width: 400px;
          width: 90%;
          animation: fadeIn 1.5s ease-in-out;
        }

        .success-image {
          max-width: 100%;
          height: auto;
          margin-bottom: 1rem;
          animation: fadeIn 1.5s ease-in-out;
        }
  
        .success-text {
          font-size: 1.8rem;
          font-weight: bold;
          margin: 1rem 0;
          color: #000; /* Ensure the text is black */
        }
  
        .btn-custom {
          background-color: #28a745; /* Green Button */
          border-color: #28a745;
          font-size: 1rem;
          padding: 0.6rem 1.5rem;
          border-radius: 0.5rem;
          color: white;
          font-weight: bold;
          margin-top: 1rem;
          display: inline-block;
          transition: all 0.3s ease-in-out;
        }
  
        .btn-custom:hover {
          background-color: #218838;
          border-color: #218838;
          color: white;
          transform: scale(1.05);
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(-20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
    </style>
</head>
<body>

    <div class="success-container">
        <img src="/media/lottery_images/success.png" alt="Success" class="success-image">
        <div class="success-text">Payment Successful!</div>
        <p>Thank you for shopping with us. Redirecting to My Orders...</p>
        <a href="/my-orders/" class="btn btn-custom">Go to My Orders</a>
    </div>

    <script>  
        history.pushState(null, document.title, location.href);
        window.addEventListener('popstate', function (event) {
            history.pushState(null, document.title, location.href);
            window.location.href = '/my-orders/';
            
        });
    </script>
  
</body>
</html>
