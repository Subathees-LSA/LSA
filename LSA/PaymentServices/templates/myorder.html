  {% load static %}
  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'js/custom.js' %}"></script>
    <script>
        var my_orders_csrfToken = "{{ csrf_token }}"; // Store CSRF token globally
    </script>
    <style>
        /* Add these to your style.css */
        .myorder-winner-badge {
            background-color: #ffd700;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .myorder-ticket-winner-indicator {
            color: #ffd700;
            font-weight: bold;
            margin-left: 5px;
        }
        
        .myorder-winning-ticket {
            color: #ffd700;
            font-weight: bold;
        }
        
        .myorder-winner-notice {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>

<body class="myorderpage">
    {% include 'header.html' %}
    <div class="myorder-main-container">
        <!-- Left Sidebar -->
        {% include 'myorder-sidebar.html' %}
        <!-- Main Content -->
        <div class="myorder-content">
            <div class="myorder-header">
                <h3 class="myorder-heading">Previous Orders</h3>
                <select id="myorder-filter" class="myorders-filters">
                    <option value="all">All</option>
                    <option value="1month">Last 1 Month</option>
                    <option value="6month">Last 6 Months</option>
                    <option value="1year">Last 1 Year</option>
                </select>
            </div>

            <div class="myorder-container" id="myorders-container">
                <p>Loading orders...</p>
            </div>
        </div>
    </div>

    {% include 'footer.html' %}
    
</body>
</html>
