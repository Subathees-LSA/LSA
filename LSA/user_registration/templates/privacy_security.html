{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Privacy & Security</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'js/custom.js' %}" defer></script>
    <script>
        const category_id = "{{ category_id }}";
          const api_get_categories_url = "{% url 'api_get_lottery_categories' %}";
        window.onload = function () {
            header_navbar_fetchCategories();
            updateCartCount(); 
          updateFavoritesCount();
          setupDropdown(".dropbtn_competitions", ".dropdown-content_competitions");
        
        }; 
    </script>
</head>

<body class="privacy-body">
    {% include 'header.html' %}
    <div class="privacy-container">
        <h1>Privacy & Security</h1>
        <div class="privacy-profile-section">
            <h2>Personal Profile</h2>
            <form id="privacy-form" data-api-url="{% url 'api-privacy-security' %}">
                {% csrf_token %}

                <!-- Read-only fields -->
                <label for="privacy-username">Username:</label>
                <input type="text" id="privacy-username" name="username" value="{{ username }}" readonly />

                <label for="privacy-email">Email:</label>
                <input type="email" id="privacy-email" name="email" value="{{ email }}" readonly />

                <label for="privacy-last-login">Last Login:</label>
                <input type="text" id="privacy-last-login" name="last_login" value="{{ last_login }}" readonly />

                <label for="privacy-date-joined">Date Joined:</label>
                <input type="text" id="privacy-date-joined" name="date_joined" value="{{ date_joined }}" readonly />

                <!-- Editable fields -->
                <label for="privacy-dob">Date of Birth (DOB):</label>
               <input type="date" id="privacy-dob"name="dob"value="{{ user.userprivacy.dob|date:'Y-m-d' }}"min="1900-01-01"max="{{ today|date:'Y-m-d' }}"/>
                <div id="privacy-dob-error" class="privacy-error"></div>

                <label for="privacy-phone-number">Phone Number (UK):</label>
                <input type="text" id="privacy-phone-number" name="phone_number"
                value="{{ user.userprivacy.phone_number|default:'' }}" placeholder="Enter a valid phone number" />
                <div id="privacy-phone-error" class="privacy-error"></div>

                <!-- Two-Factor Authentication Checkbox -->
                <!-- <label for="privacy-two-factor-auth">Enable Two-Factor Authentication (2FA):</label>
                <input type="checkbox" id="privacy-two-factor-auth" name="two_factor_auth_enabled"
                    {% if user.userprivacy.two_factor_auth_enabled %} checked {% endif %} /> -->

                <button type="button" id="privacy-save-changes">Save Changes</button>
            </form>
        </div>
        <div id="privacy-message" style="display:none;"></div>
    </div>
</body>

</html>
